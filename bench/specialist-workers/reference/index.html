<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TeamDesk — Settings</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">TeamDesk</div>
      <div class="who">
        <span id="userName"></span>
        <img id="avatar" class="avatar" alt="" src="/avatar.svg" />
      </div>
    </header>
    <main>
      <section class="page-head">
        <h1>Settings</h1>
        <p>Workspace name and email digest for your team.</p>
      </section>
      <section class="card" id="settingsCard">
        <h2>Workspace settings</h2>
        <form id="settingsForm">
          <label>Workspace name <input id="wsName" name="workspaceName" /></label>
          <label>Digest email
            <select id="digest" name="digest">
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="off">Off</option>
            </select>
          </label>
          <button class="btn btn-primary" type="submit">Save changes</button>
        </form>
        <p id="status" role="status"></p>
      </section>
      <section class="composer-wrap">
        <form class="composer" id="composer">
          <input id="note" placeholder="Leave a note for the team" />
          <button id="send" class="send" type="submit" aria-label="Send">Send</button>
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
